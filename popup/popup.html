<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClaudeStat</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  
  <header>
    <div class="header-title">ClaudeStat</div>
    <div class="header-actions">
      <button id="btn-refresh" class="icon-button" aria-label="Refresh data">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21v-5h5"/></svg>
      </button>
      <button id="btn-settings" class="icon-button" aria-label="Open settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
      </button>
    </div>
  </header>

  <main id="content">
    <div id="view-skeleton" class="hidden"></div>
    <div id="view-error" class="hidden"></div>
    <div id="view-usage" class="hidden"></div>
  </main>

  <aside id="settings-panel">
    <header>
      <button id="btn-close-settings" class="icon-button" aria-label="Close settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <div class="header-title">Settings</div>
      <div style="width:28px"></div> <!-- Spacer for flex alignment -->
    </header>
    <!-- Settings injected here -->
    <div id="settings-content" style="padding: 0 16px; flex-grow: 1; overflow-y: auto;"></div>
  </aside>

  <script type="module" src="popup.js"></script>
</body>
</html>
